<!doctype html>
<html lang="en">

<head>
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet">

  <!-- Core -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Reschools - School ERP for Fees, Attendance &amp; Student Management</title>
  <meta name="description" content="Manage fees, attendance, exams and student records in one simple school ERP built for real schools." />
  <meta name="author" content="Reschools" />
  <meta name="robots" content="index, follow" />
  <meta name="keywords" content="school ERP, school management software, fee management, attendance tracking, student records, school administration, India school ERP" />

  <!-- Canonical -->
  <link rel="canonical" href="https://www.reschools.in/" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/Favicon.png?v=5" />
  <link rel="apple-touch-icon" href="/Favicon.png" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.reschools.in/" />
  <meta property="og:site_name" content="Reschools" />
  <meta property="og:title" content="Reschools - School ERP for Fees, Attendance &amp; Student Management" />
  <meta property="og:description" content="Manage fees, attendance, exams and student records in one simple school ERP built for real schools." />
  <meta property="og:image" content="https://www.reschools.in/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Reschools - School ERP Dashboard" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@Reschools" />
  <meta name="twitter:creator" content="@Reschools" />
  <meta name="twitter:url" content="https://www.reschools.in/" />
  <meta name="twitter:title" content="Reschools - School ERP for Fees, Attendance &amp; Student Management" />
  <meta name="twitter:description" content="Manage fees, attendance, exams and student records in one simple school ERP built for real schools." />
  <meta name="twitter:image" content="https://www.reschools.in/og-image.png" />
  <meta name="twitter:image:alt" content="Reschools - School ERP Dashboard" />

  <!-- JSON-LD Structured Data: SoftwareApplication & FAQPage -->
  <script type="application/ld+json">
  [
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Reschools",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "Web",
      "url": "https://www.reschools.in/",
      "description": "Reschools is a comprehensive school ERP designed for efficient fee management, attendance tracking, and student performance reports.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      }
    },
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Reschools?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Reschools is a web-based school ERP system that helps schools manage fees, attendance, student records, exams, and parent communication from one dashboard."
          }
        },
        {
          "@type": "Question",
          "name": "Who can use Reschools?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It is designed for school administrators, accountants, teachers, students, and parents with dedicated dashboards for each role."
          }
        },
        {
          "@type": "Question",
          "name": "Does Reschools support fee collection?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, it includes a complete fee management module with automated tracking, payment recording, and printable receipts."
          }
        },
        {
          "@type": "Question",
          "name": "Is Reschools cloud-based?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Reschools is fully cloud-based and accessible from any modern web browser without any local installation."
          }
        }
      ]
    },
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Reschools",
      "url": "https://www.reschools.in/"
    }
  ]
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
